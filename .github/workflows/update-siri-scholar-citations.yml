name: Update SIRI Google Scholar citations

on:
  push:
    paths:
      - .github/workflows/update-siri-scholar-citations.yml
      - scripts/update_siri_scholar_citations.py
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Google Scholar count
        run: python3 scripts/update_siri_scholar_citations.py
      - name: Commit changed count
        run: |
          if git diff --quiet -- SIRI/static/citations/siri-scholar.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SIRI/static/citations/siri-scholar.json
          git commit -m "Update SIRI Google Scholar citation count"
          git push
